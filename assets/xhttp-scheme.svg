<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">Два транспорта · один внешний TCP/443</title><desc id="desc">REALITY обрабатывается Xray; HTTPS и XHTTP проходят через локальный TLS target Nginx.</desc>
<defs><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#a77b32"/></marker><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#287d72"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#416eab"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#5d7083"/></marker></defs>
<rect width="1440" height="1120" rx="20" fill="#f8f7f3"/>
<text x="36" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a77b32" font-weight="700">NUVRION / TECHNICAL ARCHITECTURE</text>
<text x="36" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#233447" font-weight="700">Два транспорта · один внешний TCP/443</text>
<text x="36" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5d7083" font-weight="400">REALITY обрабатывается Xray; HTTPS и XHTTP проходят через локальный TLS target Nginx.</text>
<rect x="36" y="155" width="390" height="139" rx="12" fill="#ffffff" stroke="#d8dfdf" stroke-width="1.5"/>
<rect x="36" y="169" width="4" height="111" rx="2" fill="#416eab"/>
<text x="56" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#233447" font-weight="650">Клиенты / Internet</text>
<text x="56" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">REALITY VLESS · Firefox · Vision</text>
<text x="56" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">HTTPS браузер → сайт декой</text>
<text x="56" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">XHTTP + TLS · Firefox · h2 / http/1.1</text>
<rect x="520" y="155" width="420" height="139" rx="12" fill="#ffffff" stroke="#d8dfdf" stroke-width="1.5"/>
<rect x="520" y="169" width="4" height="111" rx="2" fill="#287d72"/>
<text x="540" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#233447" font-weight="650">Xray · REALITY TCP / RAW</text>
<text x="540" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">Remnawave Node · network_mode: host</text>
<text x="540" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">Публичный listener TCP/443</text>
<text x="540" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">Авторизация VLESS / REALITY</text>
<path d="M426,224 L520,224" fill="none" stroke="#416eab" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="438" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#416eab" font-weight="500">TLS / :443</text>
<rect x="1018" y="155" width="386" height="139" rx="12" fill="#ffffff" stroke="#d8dfdf" stroke-width="1.5"/>
<rect x="1018" y="169" width="4" height="111" rx="2" fill="#287d72"/>
<text x="1038" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#233447" font-weight="650">Routing / Outbound Xray</text>
<text x="1038" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">DIRECT → целевой Internet</text>
<text x="1038" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">BLOCK → правила профиля</text>
<text x="1038" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">Оба inbound используют routing</text>
<path d="M940,224 L1018,224" fill="none" stroke="#287d72" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="975" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#287d72" font-weight="500">Авторизованный REALITY → напрямую</text>
<path d="M730,294 L730,400" fill="none" stroke="#a77b32" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
<text x="750" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#a77b32" font-weight="500">Обычный TLS / XHTTP TLS</text>
<text x="750" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#a77b32" font-weight="500">Reality target · xver: 1</text>
<rect x="390" y="400" width="680" height="112" rx="12" fill="#ffffff" stroke="#d8dfdf" stroke-width="1.5"/>
<rect x="390" y="414" width="4" height="84" rx="2" fill="#a77b32"/>
<text x="410" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#233447" font-weight="650">Unix socket · nginx.sock</text>
<text x="410" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">/dev/shm/nuvrion-xhttp/nginx.sock · mode 0600</text>
<text x="410" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">TLS bytes + PROXY protocol v1 (реальный IP клиента)</text>
<path d="M730,512 L730,566" fill="none" stroke="#a77b32" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
<text x="754" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#a77b32" font-weight="500">TLS termination</text>
<rect x="390" y="566" width="680" height="139" rx="12" fill="#ffffff" stroke="#d8dfdf" stroke-width="1.5"/>
<rect x="390" y="580" width="4" height="111" rx="2" fill="#a77b32"/>
<text x="410" y="597" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#233447" font-weight="650">Nginx · ssl proxy_protocol · HTTP/2</text>
<text x="410" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">listen unix:…/nginx.sock ssl proxy_protocol;  http2 on;</text>
<text x="410" y="651" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">X-Forwarded-For / X-Real-IP ← $proxy_protocol_addr</text>
<text x="410" y="676" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">Маршрутизация по location; TLS-сертификат Let’s Encrypt</text>
<rect x="36" y="790" width="318" height="111" rx="12" fill="#ffffff" stroke="#d8dfdf" stroke-width="1.5"/>
<rect x="36" y="804" width="4" height="83" rx="2" fill="#416eab"/>
<text x="56" y="821" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#233447" font-weight="650">/ → сайт декой</text>
<text x="56" y="850" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5d7083" font-weight="400">Статические HTML / JS / assets</text>
<text x="56" y="875" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5d7083" font-weight="400">Ожидаемый HTTPS status: 200</text>
<rect x="402" y="790" width="342" height="111" rx="12" fill="#ffffff" stroke="#d8dfdf" stroke-width="1.5"/>
<rect x="402" y="804" width="4" height="83" rx="2" fill="#416eab"/>
<text x="422" y="821" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#233447" font-weight="650">/api/game/ → local API</text>
<text x="422" y="850" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5d7083" font-weight="400">Unix socket /run/…/game.sock</text>
<text x="422" y="875" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5d7083" font-weight="400">systemd · SQLite · без TCP upstream</text>
<rect x="802" y="790" width="602" height="111" rx="12" fill="#ffffff" stroke="#d8dfdf" stroke-width="1.5"/>
<rect x="802" y="804" width="4" height="83" rx="2" fill="#a77b32"/>
<text x="822" y="821" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#233447" font-weight="650">/api/v3/sync/ → XHTTP proxy</text>
<text x="822" y="850" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">proxy_pass http://unix:…/xrxh.socket;</text>
<text x="822" y="875" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">HTTP/1.1 · buffering off · request_buffering off</text>
<path d="M535,705 L535,742 L195,742 L195,790" fill="none" stroke="#416eab" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M640,705 L640,763 L573,763 L573,790" fill="none" stroke="#416eab" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M930,705 L930,741 L1103,741 L1103,790" fill="none" stroke="#a77b32" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
<rect x="802" y="963" width="602" height="99" rx="12" fill="#ffffff" stroke="#d8dfdf" stroke-width="1.5"/>
<rect x="802" y="977" width="4" height="71" rx="2" fill="#287d72"/>
<text x="822" y="994" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#233447" font-weight="650">Xray · VLESS XHTTP inbound</text>
<text x="822" y="1023" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">…/xrxh.socket,0660 · mode auto · extra из профиля</text>
<text x="822" y="1048" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">trustedXForwardedFor → IP клиента; далее routing</text>
<path d="M1103,901 L1103,963" fill="none" stroke="#a77b32" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
<text x="1124" y="941" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#a77b32" font-weight="500">Локальный HTTP · без TLS</text>
<text x="36" y="965" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#233447" font-weight="600">HTTP 400 без XHTTP-сессии допустим,</text>
<text x="36" y="991" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">если ответ подтверждён прямым backend.</text>
<text x="36" y="1020" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5d7083" font-weight="400">502 / socket error → инфраструктура не готова.</text>
<path d="M36,1070 H1404" stroke="#d9dfdf"/>
<text x="36" y="1092" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5d7083" font-weight="400">Пути показаны для новой защищённой установки. При legacy-импорте сохраняются /dev/shm/nginx.sock и xrxh.socket,0666.</text>
</svg>
