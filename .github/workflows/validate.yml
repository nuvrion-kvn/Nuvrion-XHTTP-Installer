name: Проверка XHTTP Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Проверка Bash и SHA-256
        run: |
          bash -n nuvrion-xhttp-install.sh
          sha256sum -c SHA256SUMS

      - name: Проверка Python и shell regression tests
        id: regression
        run: |
          set -o pipefail
          sudo python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 \
            | tee "$RUNNER_TEMP/xhttp-tests.log"

      - name: Ошибки регрессионных тестов
        if: failure() && steps.regression.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path

          log = Path(os.environ['RUNNER_TEMP']) / 'xhttp-tests.log'
          lines = log.read_text(errors='replace').splitlines()
          start = next((index for index, line in enumerate(lines)
                        if line.startswith(('FAIL:', 'ERROR:'))), max(0, len(lines) - 30))
          excerpt = '\n'.join(lines[start:])[-30000:]
          annotation = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Regression test failure::' + annotation)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Ошибки unit/shell tests\n\n<pre>'
                            + html.escape(excerpt) + '</pre>\n')
          PY

      - name: Воспроизводимая автономная сборка
        run: |
          cp nuvrion-xhttp-install.sh /tmp/xhttp.before
          cp SHA256SUMS /tmp/SHA256SUMS.before
          python3 tools/build_xhttp.py
          cmp /tmp/xhttp.before nuvrion-xhttp-install.sh
          cmp /tmp/SHA256SUMS.before SHA256SUMS

      - name: Установка проверенного ShellCheck 0.11.0
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 120 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Проверка ShellCheck
        run: |
          shellcheck --version
          shellcheck -S style nuvrion-xhttp-install.sh vendor/nuvrion-auto-tuning-xhttp.sh src/*.sh

      - name: Проверка diff
        run: git diff --check
