name: Проверка XHTTP Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-installer:
    # A source-only PR may carry the payload marker while the full offline
    # installer exceeds the connector's request limit. Build it on GitHub,
    # commit only the two generated files, then validate that exact branch.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Собрать автономный установщик в ветке изменения
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python3 tools/build_xhttp.py
          if ! git diff --quiet -- nuvrion-xhttp-install.sh SHA256SUMS; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add nuvrion-xhttp-install.sh SHA256SUMS
            git commit -m 'Rebuild the verified offline installer and checksum'
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi

  validate:
    needs: prepare-installer
    if: always() && (needs.prepare-installer.result == 'success' || needs.prepare-installer.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref }}

      - name: Проверка Bash и SHA-256
        run: |
          bash -n install.sh
          bash -n nuvrion-xhttp-install.sh
          sha256sum -c SHA256SUMS

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Проверка каталога, перевода, карточек и анимации
        run: |
          npm ci --prefix site --ignore-scripts
          npm test --prefix site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверка изображений и прозрачности
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 site/scripts/check-assets.py

      - name: Проверка Python и shell regression tests
        id: regression
        run: |
          set -o pipefail
          sudo python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 \
            | tee "$RUNNER_TEMP/xhttp-tests.log"

      - name: Ошибки регрессионных тестов
        if: failure() && steps.regression.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path

          log = Path(os.environ['RUNNER_TEMP']) / 'xhttp-tests.log'
          lines = log.read_text(errors='replace').splitlines()
          start = next((index for index, line in enumerate(lines)
                        if line.startswith(('FAIL:', 'ERROR:'))), max(0, len(lines) - 30))
          excerpt = '\n'.join(lines[start:])[-30000:]
          annotation = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Regression test failure::' + annotation)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Ошибки unit/shell tests\n\n<pre>'
                            + html.escape(excerpt) + '</pre>\n')
          PY

      - name: Воспроизводимая автономная сборка
        run: |
          cp nuvrion-xhttp-install.sh /tmp/xhttp.before
          cp SHA256SUMS /tmp/SHA256SUMS.before
          python3 tools/build_xhttp.py
          cmp /tmp/xhttp.before nuvrion-xhttp-install.sh
          cmp /tmp/SHA256SUMS.before SHA256SUMS

      - name: Совместимость объединения с Docker Compose 2.24.6
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 120 \
            https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64 \
            -o "$RUNNER_TEMP/docker-compose-2.24.6"
          echo "eca30ae32dc451f9e6d6c8ddce078a76f23b355c3ca0ab391d58f59e87c0d310  $RUNNER_TEMP/docker-compose-2.24.6" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/docker-compose-2.24.6"
          NUVRION_TEST_COMPOSE_BIN="$RUNNER_TEMP/docker-compose-2.24.6" \
            python3 -m unittest discover -s tests -p 'test_compose_merge.py' -v

      - name: Настоящий nginx, TLS, MIME, ресурсы и защита маршрутов
        env:
          NUVRION_NGINX_DOCKER: nginx:1.30
        run: |
          docker pull nginx:1.30
          python3 -m unittest discover -s tests -p 'test_atlas_nginx.py' -v

      - name: Установка проверенного ShellCheck 0.11.0
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 120 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Проверка ShellCheck
        run: |
          shellcheck --version
          shellcheck -S style install.sh nuvrion-xhttp-install.sh vendor/nuvrion-auto-tuning-xhttp.sh src/*.sh

      - name: Проверка diff
        run: git diff --check
